const glassMat=flat(0xdfe6f2,0x8f98b5,.1,.55);
const capMat=flat(0xe6ebf5,0x9aa3bd,.08,.5);
const plastic=flat(0xffffff,0xc4c4d2,1,1,true);
const liquidMat=new THREE.MeshBasicMaterial({transparent:true,depthWrite:false,side:DS});

const bottle=new THREE.Group();scene.add(bottle);
const R=1.9;
const outer=[[0,0],...arc(R-.45,.45,.45,-90,0,10),...arc(R-.7,8.5,.7,0,90,12),[1.05,9.3],[1.05,9.9],[.92,9.9]];
const inner=outer.map(p=>[Math.max(0,p[0]-.14),p[1]<.6?p[1]+.35:p[1]]);
const body=lathe(outer,glassMat);body.renderOrder=2;
const wall=lathe(inner,glassMat);wall.renderOrder=2;
const liquid=lathe([[0,.4],...arc(1.19,.95,.55,-90,0,8),[1.74,8.1],[0,8.1]],liquidMat);liquid.renderOrder=1;
const tube=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,9.4,16),plastic);tube.position.set(.3,5.2,0);
bottle.add(body,wall,liquid,tube);

const collar=lathe([[.95,9.35],[1.14,9.35],[1.14,10.4],[1.08,10.5],[.7,10.5],[.7,10.55]],plastic);
const stem=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.7,40),plastic);stem.position.y=10.85;
const head=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.85,40),plastic);head.position.y=11.5;
const nozzle=new THREE.Mesh(new THREE.CylinderGeometry(.17,.17,.8,24),plastic);nozzle.rotation.z=Math.PI/2;nozzle.position.set(-.55,11.65,0);
bottle.add(collar,stem,head,nozzle);
[9.9,10.2].forEach(y=>{const g=new THREE.Mesh(new THREE.TorusGeometry(1.145,.03,8,96).rotateX(Math.PI/2),plastic);g.position.y=y;bottle.add(g);});
const cap=lathe([[.88,10.5],[1,10.5],[1,12.9],...arc(.8,12.9,.2,0,90,8),[0,13.1]],capMat);cap.renderOrder=3;bottle.add(cap);

function setLiquid(blue){liquidMat.color.set(blue?0x7284ee:0xe3edf7);liquidMat.opacity=blue?.6:.25;$('#bLiq').textContent='Cairan: '+(blue?'Biru telang':'Bening');}
new THREE.TextureLoader().load(IMG,tex=>{
  tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  const rl=R+.015,h=2*Math.PI*rl*tex.image.height/tex.image.width;
  const label=new THREE.Mesh(new THREE.CylinderGeometry(rl,rl,h,128,1,true),new THREE.MeshBasicMaterial({map:tex}));
  label.position.y=4.45;label.rotation.y=-.55*2*Math.PI;bottle.add(label);
});

/* controls */
let blue=true;setLiquid(blue);
$('#bAuto').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.setAttribute('aria-pressed',controls.autoRotate);};
$('#bLiq').onclick=()=>{blue=!blue;setLiquid(blue);};
const modes=['auto','light','dark'],names={auto:'Otomatis',light:'Terang',dark:'Gelap'};let mi=0;
$('#bTheme').onclick=e=>{mi=(mi+1)%3;const m=modes[mi];if(m==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=m;e.currentTarget.textContent='Latar: '+names[m];};

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w/h<.7?38:28;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
(function loop(){controls.update();renderer.render(scene,camera);requestAnimationFrame(loop);})();
}catch(e){$('#err').hidden=false;console.error(e);}
})();
</script>
</body>
</html>
